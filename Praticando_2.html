<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Praticando 2 - Tabela grande com colspan e rowspan colorida com CSS</title>
    <style>

        body {
            background-color: lightblue;
            font-family: "Times New Roman", Times, serif;
        }

        h1 {
            font-size: 28px;
        }

        table {
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        td, th {
            border: 1px solid red;
            padding: 10px;
            text-align: center;
        }

       
        .tabela-grande td {
            width: 120px;
            height: 80px;
        }

        
        .tabela-legenda td {
            width: 60px;
            height: 20px;
            padding: 3px 8px;
        }

        .vermelho {
            background-color: red;
        }

        .azul {
            background-color: blue;
        }

        .verde {
            background-color: green;
        }

        .amarelo {
            background-color: yellow;
        }
        .branco{
            background-color: white;
        }

    </style>

</head>

<body>

    <h1>Praticando 2 - Tabela grande com colspan e rowspan colorida com CSS</h1>
    <p>Tabela grande com colspan e rowspan</p>
    <table class="tabela-grande">
        <tr>
            <td colspan="2" class="verde">
                Colspan
            </td>

            <td class="verde">
                -
            </td>

            <td rowspan="3" class="verde">
                Rowspan
            </td>
        </tr>
        <tr>
            <td class="vermelho">
                -
            </td>

            <td class="vermelho">
                -
            </td>

            <td class="vermelho">
                -
            </td>
        </tr>
        <tr>
            <td class="azul">
                -
            </td>

            <td colspan="2" class="azul">
                Colspan
            </td>
        </tr>
        <tr>
            <td class="amarelo">
                -
            </td>

            <td class="amarelo">
                -
            </td>

            <td class="amarelo">
                -
            </td>

            <td class="amarelo">
                -
            </td>
        </tr>
    </table>
    <p>Legenda</p>

    <table class="tabela-legenda">
        <tr>
            <td class="branco">Linha 1</td>
            <td class="verde">--------</td>
            <td class="branco">green</td>
        </tr>
        <tr>
            <td class="branco">Linha 2</td>
            <td class="vermelho">--------</td>
            <td class="branco">red</td>
        </tr>
        <tr>
            <td class="branco">Linha 3</td>
            <td class="azul">--------</td>
            <td class="branco">blue</td>
        </tr>
        <tr>
            <td class="branco">Linha 4</td>
            <td class="amarelo">--------</td>
            <td class="branco">yellow</td>
        </tr>
    </table>

    <a href="index.html">Voltar para o Menu</a>
</body>
</html>
